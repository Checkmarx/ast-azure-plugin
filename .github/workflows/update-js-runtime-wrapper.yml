name: Update AST CLI JavaScript Runtime Wrapper Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Specify a version (e.g., 1.2.3). Leave empty for the latest official version."
        required: false
        default: ""
  repository_dispatch:
    types: [js-runtime-wrapper-version-update]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-js-wrapper:
    name: Update JS Runtime Wrapper Version
    runs-on: cx-public-ubuntu-x64
    environment: release-automation
    permissions:
      contents: read  # for actions/checkout; the branch push and the PR use the GitHub App token
      id-token: write  # for configure-aws-credentials to assume the AWS role via OIDC

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Verify single lockfile
        run: |
          if [ -f package-lock.json ] && [ -f yarn.lock ]; then
            echo "ERROR: Both lockfiles exist"
            exit 1
          fi

          if [ ! -f yarn.lock ] && [ ! -f package-lock.json ]; then
            echo "ERROR: No lockfile found,Policy requires exactly ONE package manager lockfile"
            exit 1
          fi

      - name: Determine Version
        id: get_version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || github.event.client_payload.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(curl -s "https://api.github.com/repos/Checkmarx/ast-cli-javascript-wrapper-runtime-cli/releases" | jq -r '[.[] | select(.prerelease == false) | .tag_name | select(test("^v?[0-9]+\.[0-9]+\.[0-9]+$")) | ltrimstr("v")] | sort_by(split(".") | map(tonumber)) | .[-1]')
          fi

          # Remove leading 'v' if present
          VERSION="${VERSION#v}"
          echo "Normalized version (without leading 'v'): $VERSION"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Failed to determine a valid version."
            exit 1
          fi

          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update package.json
        run: |
          sed -i "s|\"@Checkmarx/ast-cli-javascript-wrapper-runtime-cli\": \"[0-9]*\.[0-9]*\.[0-9]*\"|\"@Checkmarx/ast-cli-javascript-wrapper-runtime-cli\": \"${VERSION}\"|" cxAstScan/package.json

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          registry-url: https://npm.echohq.com/

      - name: Configure registry auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ECHO_LIBRARIES_ACCESS_KEY: ${{ secrets.ECHO_LIBRARIES_ACCESS_KEY }}
        run: |
          npm config set //npm.pkg.github.com/:_authToken "${GH_TOKEN}"
          npm config set //npm.echohq.com/:_authToken "${ECHO_LIBRARIES_ACCESS_KEY}"

      - name: Build step
        run: |
          npm ci --ignore-scripts
          cd cxAstScan/
          npm ci --ignore-scripts

      - name: Commit Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add cxAstScan/package.json cxAstScan/package-lock.json
          git commit -m "Update AST CLI JavaScript Wrapper to version ${VERSION}"

      - name: Configure AWS credentials
        uses: step-security/configure-aws-credentials@1448016543d4432bd608e0de7871c7bf9e9be925 # v6.2.1
        with:
          role-to-assume: ${{ secrets.PLUGINS_APP_ROLE_ARN }}
          aws-region: ${{ secrets.PLUGINS_APP_AWS_REGION }}
          role-session-name: plugins-release-update-pr

      - name: Fetch GitHub App private key
        uses: step-security/aws-secretsmanager-get-secrets@102b6b2a2528747bcc321bb99ef326d8be7ef58f # v3.0.1
        with:
          secret-ids: PLUGINS_APP_KEY,${{ secrets.PLUGINS_APP_SECRET_NAME }}

      - name: Mask each line of the private key
        run: |
          while IFS= read -r line; do
            line="${line%$'\r'}"
            if [ -n "${line}" ]; then
              echo "::add-mask::${line}"
            fi
          done <<< "${PLUGINS_APP_KEY}"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.PLUGINS_APP_CLIENT_ID }}
          private-key: ${{ env.PLUGINS_APP_KEY }}
          permission-contents: write  # push the update branch
          permission-pull-requests: write  # open the PR and enable auto-merge

      - name: Remove the private key from the environment
        run: echo "PLUGINS_APP_KEY=" >> "${GITHUB_ENV}"

      - name: Create Pull Request
        id: create_pull_request
        uses: step-security/create-pull-request@50c103da2b9ca12cd5bc013fc6931051a5aa872b # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: Update AST CLI JavaScript Runtime Wrapper to version ${{ env.VERSION }}
          title: Update AST CLI JavaScript Runtime Wrapper to version ${{ env.VERSION }}
          body: |
            Updates the AST CLI JavaScript Runtime Wrapper to version `${{ env.VERSION }}`

            Auto-generated by [create-pull-request][2]
          labels: cxone
          branch: feature/update_js_wrapper_${{ env.VERSION }}

      - name: Enable auto-merge (squash after 2 cx-maintainers approvals)
        if: steps.create_pull_request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.create_pull_request.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash
