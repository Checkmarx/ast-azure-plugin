name: Release Creation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: false
        type: string
      publisherID:
        description: 'Enter Publisher ID (ignore if not dev build)'
        required: false
        type: string
      dev:
        description: 'Is dev build'
        required: false
        default: true
        type: boolean
      publish:
        description: 'Publish to Azure DevOps Marketplace'
        required: false
        default: false
        type: boolean

env:
  PUBLISHER: Checkmarx

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    name: Create Release
    runs-on: cx-public-ubuntu-x64
    permissions:
      contents: write  # for git push tag and GitHub release creation
      packages: read  # for npm registry auth
    outputs:
      CLI_VERSION: ${{ steps.extract_cli_version.outputs.CLI_VERSION }}
      TAG_NAME: ${{ steps.set_tag_name.outputs.TAG_NAME }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Verify single lockfile
        run: |
          if [ -f package-lock.json ] && [ -f yarn.lock ]; then
            echo "ERROR: Both lockfiles exist"
            exit 1
          fi

          if [ ! -f yarn.lock ] && [ ! -f package-lock.json ]; then
            echo "ERROR: No lockfile found,Policy requires exactly ONE package manager lockfile"
            exit 1
          fi

      - name: Set Extension and Publisher ID
        env:
          IS_DEV: ${{ inputs.dev }}
          PUBLISHER_ID_INPUT: ${{ inputs.publisherID }}
        run: |
          if [ "${IS_DEV}" == "true" ]; then
            echo "EXTENSION_ID=checkmarx-ast-azure-plugin-dev" >> $GITHUB_ENV
            if [ -n "${PUBLISHER_ID_INPUT}" ]; then
              echo "PUBLISHER=${PUBLISHER_ID_INPUT}" >> $GITHUB_ENV
            fi
          else
            echo "EXTENSION_ID=checkmarx-ast-azure-plugin" >> $GITHUB_ENV
          fi

      - name: Determine Release Version
        id: set_tag_name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if [[ -z "${INPUT_TAG}" ]]; then
            # Fetch the latest GitHub release tag
            LATEST_TAG=$(curl -sL \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: token ${GH_TOKEN}" \
              "https://api.github.com/repos/${REPO}/releases/latest" | jq -r .tag_name)

            # If no release is found, fallback to default
            if [[ "$LATEST_TAG" == "null" || -z "$LATEST_TAG" ]]; then
              echo "No release found, should provide a tag"
              exit 1
            fi

            echo "Latest GitHub release tag: $LATEST_TAG"

            # Extract numeric parts safely
            if [[ $LATEST_TAG =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
            else
              echo "Invalid tag format: $LATEST_TAG"
              exit 1
            fi

            # Bump patch version
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          else
            NEW_VERSION="${INPUT_TAG}"
          fi

          echo "RELEASE_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$NEW_VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Tag and Push New Version
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag -a "${RELEASE_VERSION}" -m "Release ${RELEASE_VERSION}"
          git push origin "${RELEASE_VERSION}"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          registry-url: https://npm.echohq.com/

      - name: Configure registry auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ECHO_LIBRARIES_ACCESS_KEY: ${{ secrets.ECHO_LIBRARIES_ACCESS_KEY }}
        run: |
          npm config set //packages.echohq.com/:_authToken "${ECHO_LIBRARIES_ACCESS_KEY}"
          npm config set always-auth true
          npm config set //npm.pkg.github.com/:_authToken "${GH_TOKEN}"

      - run: sudo npm install -g tfx-cli --registry https://npm.echohq.com/

      - name: Build step
        run: |
          npm ci --ignore-scripts
          cd cxAstScan/
          npm ci --ignore-scripts

      - run: npm run build

      - name: Set major, minor, patch values
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          CLEAN_VERSION=$(echo "${RELEASE_VERSION}" | sed 's/^v//')

          echo "CLEAN_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV
          echo "MAJOR_VERSION=$(echo $CLEAN_VERSION | cut -d. -f1)" >> $GITHUB_ENV
          echo "MINOR_VERSION=$(echo $CLEAN_VERSION | cut -d. -f2)" >> $GITHUB_ENV
          echo "PATCH_VERSION=$(echo $CLEAN_VERSION | cut -d. -f3)" >> $GITHUB_ENV


      - name: New version
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          MAJOR_VERSION: ${{ env.MAJOR_VERSION }}
          MINOR_VERSION: ${{ env.MINOR_VERSION }}
          PATCH_VERSION: ${{ env.PATCH_VERSION }}
        run: |
          echo "The new version is ${RELEASE_VERSION}"
          echo "The new major version is ${MAJOR_VERSION}"
          echo "The new minor version is ${MINOR_VERSION}"
          echo "The new patch version is ${PATCH_VERSION}"

      - name: Extract CLI version
        id: extract_cli_version
        run: |
          ls -la
          pwd
          CLI_VERSION=$(cat ./cxAstScan/node_modules/@Checkmarx/ast-cli-javascript-wrapper-runtime-cli/checkmarx-ast-cli.version | grep -Eo '^[0-9]+\.[0-9]+\.[0-9]+')
          echo "CLI version being packed is $CLI_VERSION"
          echo "CLI_VERSION=$CLI_VERSION" >> $GITHUB_ENV
          echo "CLI_VERSION=$CLI_VERSION" >> $GITHUB_OUTPUT

      - name: Set versions in files
        env:
          CLEAN_VERSION: ${{ env.CLEAN_VERSION }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          MAJOR_VERSION: ${{ env.MAJOR_VERSION }}
          MINOR_VERSION: ${{ env.MINOR_VERSION }}
          PATCH_VERSION: ${{ env.PATCH_VERSION }}
        run: |
          cat <<< $(jq ".version = \"${CLEAN_VERSION}\"" ./vss-extension.json) > ./vss-extension.json
          cat <<< $(jq ".version = \"${RELEASE_VERSION}\"" ./package.json) > ./package.json
          cat <<< $(jq ".version.Major = ${MAJOR_VERSION}" ./cxAstScan/task.json) > ./cxAstScan/task.json
          cat <<< $(jq ".version.Minor = ${MINOR_VERSION}" ./cxAstScan/task.json) > ./cxAstScan/task.json
          cat <<< $(jq ".version.Patch = ${PATCH_VERSION}" ./cxAstScan/task.json) > ./cxAstScan/task.json

      - name: Set ID public and publisher fields if dev release
        env:
          DEV_BUILD: ${{ inputs.dev }}
          EXTENSION_ID: ${{ env.EXTENSION_ID }}
          PUBLISHER_ID: ${{ inputs.publisherID }}
        run: |
          if [ "${DEV_BUILD}" == "true" ]; then
            cat <<< $(jq ".public = false" vss-extension.json) > vss-extension.json
            cat <<< $(jq ".id = \"${EXTENSION_ID}\"" vss-extension.json) > vss-extension.json
            cat <<< $(jq ".publisher = \"${PUBLISHER_ID}\"" vss-extension.json) > vss-extension.json
          fi

      - name: Remove test folder
        run: rm -rf ./cxAstScan/test

      - name: Create extension
        run: tfx extension create --manifest-globs vss-extension.json

      - name: Create Release
        uses: step-security/action-gh-release@277bfa82abcfdb73e5bbb19e213fd76532ee2be5 # v3.0.0
        with:
          release_name: Checkmarx Azure ${{ env.RELEASE_VERSION }}
          tag_name: ${{ env.RELEASE_VERSION }}
          files: ./${{ env.PUBLISHER }}.${{ env.EXTENSION_ID }}-${{ env.CLEAN_VERSION }}.vsix
          generate_release_notes: true
          prerelease: ${{ inputs.dev }}

      - name: Release to marketplace
        if: inputs.publish == true
        env:
          AZURE_TOKEN: ${{ secrets.AZURETOKEN }}
        run: tfx extension publish --vsix *.vsix --token "${AZURE_TOKEN}"

