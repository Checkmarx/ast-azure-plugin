name: AST Azure wrapper CI

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: cx-public-ubuntu-x64
    permissions:
      contents: read
      packages: read  # Required to pull @Checkmarx package from GitHub Packages
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Verify single lockfile
        run: |
          if [ -f package-lock.json ] && [ -f yarn.lock ]; then
            echo "ERROR: Both lockfiles exist"
            exit 1
          fi

          if [ ! -f yarn.lock ] && [ ! -f package-lock.json ]; then
            echo "ERROR: No lockfile found,Policy requires exactly ONE package manager lockfile"
            exit 1
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          registry-url: https://npm.echohq.com/

      - name: Configure registry auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ECHO_LIBRARIES_ACCESS_KEY: ${{ secrets.ECHO_LIBRARIES_ACCESS_KEY }}
        run: |
          npm config set //npm.pkg.github.com/:_authToken "${GH_TOKEN}"
          npm config set //npm.echohq.com/:_authToken "${ECHO_LIBRARIES_ACCESS_KEY}"

      - name: npm install
        run: |
          npm ci --ignore-scripts
          cd cxAstScan/
          npm ci --ignore-scripts

      - name: Code Linting
        run: npm run lint

      - run: npm run build

      # The runner cannot reach download.checkmarx.com, so fetch the CLI from its GitHub
      # release instead. The wrapper skips its own download when cx and cli-version exist.
      - name: Pre-install Checkmarx CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WRAPPER=cxAstScan/node_modules/@Checkmarx/ast-cli-javascript-wrapper-runtime-cli
          VERSION=$(grep -Eo '^[0-9]+\.[0-9]+\.[0-9]+' "$WRAPPER/checkmarx-ast-cli.version")
          CHECKSUM=$(grep '"linux_x64"' "$WRAPPER/checkmarx-ast-cli.checksums" | grep -Eo '[0-9a-f]{64}')
          ASSET="ast-cli_${VERSION}_linux_x64.tar.gz"
          DEST="$WRAPPER/dist/main/wrapper/resources"
          gh release download "$VERSION" -R Checkmarx/ast-cli -p "$ASSET" -D "$RUNNER_TEMP"
          echo "$CHECKSUM  $RUNNER_TEMP/$ASSET" | sha256sum -c -
          mkdir -p "$DEST"
          tar -xzf "$RUNNER_TEMP/$ASSET" -C "$DEST" cx
          chmod 755 "$DEST/cx"
          printf '%s' "$VERSION" > "$DEST/cli-version"

      # MockTestRunner downloads Node from nodejs.org, which the runner cannot reach.
      # Seed its cache with the Node installed by setup-node so no download is needed.
      - name: Seed task-lib Node cache
        run: |
          DEST="$HOME/azure-pipelines-task-lib/_download/node20"
          mkdir -p "$DEST/node-v20.13.1-linux-x64/bin"
          ln -sf "$(command -v node)" "$DEST/node-v20.13.1-linux-x64/bin/node"
          touch "$DEST.completed"

      - name: Run tests
        env:
          CX_CLIENT_ID: ${{ secrets.CX_CLIENT_ID }}
          CX_CLIENT_SECRET: ${{ secrets.CX_CLIENT_SECRET }}
          CX_BASE_URI: ${{ secrets.CX_BASE_URI }}
          CX_TENANT: ${{ secrets.CX_TENANT }}
          CX_API_KEY: ${{ secrets.CX_API_KEY }}
        run: npm run coverage

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: ./coverage
